[package]
name = "prisca"
version = "0.1.1"
description = "Prisca: fast scanning for any WIA scanner or all-in-one printer"
license = "GPL-3.0-or-later"
authors = ["Crofty"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "prisca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
