# Builds Prisca for Windows on every push. The installer appears under the run's "Artifacts".
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet
      - name: Check the window's scripts parse
        run: |
          node --check ui/app.js
          node --check ui/imaging.js
          node --check ui/pdf.js
          node --check ui/backend.js
      # The scanner helper must at least load in Windows PowerShell 5.1 (no scanner on GitHub's machines).
      - name: Scanner helper starts and answers
        shell: powershell
        run: |
          $out = '{"id":1,"cmd":"devices"}' | powershell -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File src-tauri\scripts\wia.ps1
          $out
          if (-not ($out -match '"ready":true')) { throw "worker didn't start" }
          if (-not ($out -match '"id":1')) { throw "worker didn't answer" }
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: prisca-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
